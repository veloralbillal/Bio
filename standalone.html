        setCopiedId(id);

                        onClick={() => setSelectedWalletId(w.id)}

    // --- MAIN APP COMPONENT ---
    function App() {
      const [profile, setProfile] = useState(() => {
        try {
          const saved = localStorage.getItem('gravatar_hub_profile_v1');
          return saved ? JSON.parse(saved) : INITIAL_PROFILE;
        } catch(e) {
          return INITIAL_PROFILE;
        }
      });

      const [currentView, setCurrentView] = useState(() => {
        return window.location.hash === '#crypto' || window.location.hash === '#crypto-pay' ? 'crypto' : 'home';
      });

      const [darkMode, setDarkMode] = useState(true);
      const [contactForm, setContactForm] = useState({ name: '', email: '', message: '' });
      const [contactSent, setContactSent] = useState(false);

      useEffect(() => {
        const handleHash = () => {
          if (window.location.hash === '#crypto' || window.location.hash === '#crypto-pay') {
            setCurrentView('crypto');
          } else {
            setCurrentView('home');
          }
        };
        window.addEventListener('hashchange', handleHash);
        return () => window.removeEventListener('hashchange', handleHash);
      }, []);

      const handleOpenCryptoPage = () => {
        setCurrentView('crypto');
        window.location.hash = '#crypto-pay';
      };

      const handleBackToProfile = () => {
        setCurrentView('home');
        window.location.hash = '';
      };

      const handleSendMessage = (e) => {
        e.preventDefault();
        if (!contactForm.name || !contactForm.message) return;
        
        try {
          const existing = JSON.parse(localStorage.getItem('gravatar_hub_messages_v1') || '[]');
          const newMsg = { id: Date.now().toString(), ...contactForm, date: new Date().toLocaleDateString(), read: false };
          localStorage.setItem('gravatar_hub_messages_v1', JSON.stringify([newMsg, ...existing]));
        } catch(e) {}

        setContactSent(true);
        setContactForm({ name: '', email: '', message: '' });
        setTimeout(() => setContactSent(false), 4000);
      };

      if (currentView === 'crypto') {
        return <CryptoPaymentPage profile={profile} onBack={handleBackToProfile} />;
      }

      return (
        <div className="min-h-screen w-full max-w-full overflow-x-hidden bg-slate-950 text-slate-100 font-sans">
          
          {/* Header Bar */}
          <header className="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 sm:px-8 py-3.5 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <img src={profile.avatarUrl} alt={profile.name} className="w-9 h-9 rounded-full object-cover border-2 border-amber-500 shadow-md" />
              <div>
                <h1 className="text-sm font-black text-white">{profile.name}</h1>
                <p className="text-[10px] text-amber-400 font-mono">Digital Identity Hub</p>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <button
                onClick={handleOpenCryptoPage}
                className="px-3.5 py-2 rounded-xl bg-gradient-to-r from-amber-500 to-orange-600 text-slate-950 font-black text-xs flex items-center gap-1.5 shadow-lg transition-all hover:scale-105 active:scale-95"
              >
                <Icon name="coins" className="w-4 h-4" />
                <span>Crypto Pay</span>
              </button>
            </div>
          </header>

          {/* Profile Hero */}
          <main className="max-w-4xl mx-auto p-4 sm:p-8 space-y-10 my-4">
            
            <section className="p-6 sm:p-10 rounded-3xl bg-slate-900 border border-slate-800 shadow-2xl space-y-6 relative overflow-hidden">
              <div className="flex flex-col sm:flex-row items-center sm:items-start gap-6 text-center sm:text-left">
                <img src={profile.avatarUrl} alt={profile.name} className="w-28 h-28 sm:w-32 sm:h-32 rounded-3xl object-cover border-4 border-amber-500/80 shadow-2xl shrink-0" />
                
                <div className="space-y-3">
                  <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 text-xs font-mono font-bold">
                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping" />
                    <span>{profile.status}</span>
                  </div>

                  <h1 className="text-2xl sm:text-4xl font-black text-white">{profile.name}</h1>
                  <p className="text-xs sm:text-sm text-amber-300 font-mono font-semibold">{profile.title}</p>
                  <p className="text-xs sm:text-sm text-slate-300 leading-relaxed max-w-xl">{profile.bio}</p>

                  <div className="flex items-center justify-center sm:justify-start gap-4 text-xs text-slate-400 font-mono pt-1">
                    <span className="flex items-center gap-1.5"><Icon name="map-pin" className="w-4 h-4 text-rose-400" /> {profile.location}</span>
                  </div>
                </div>
              </div>
            </section>

            {/* Crypto Quick Gateway Card */}
            <section className="p-6 rounded-3xl bg-gradient-to-r from-amber-950/60 via-slate-900 to-slate-950 border border-amber-500/30 flex flex-col sm:flex-row items-center justify-between gap-4 shadow-xl">
              <div className="space-y-1 text-center sm:text-left">
                <div className="inline-flex items-center gap-1.5 text-xs font-mono font-bold text-amber-400">
                  <Icon name="coins" className="w-4 h-4" />
                  <span>Verified Web3 Deposit Portal</span>
                </div>
                <h3 className="text-lg font-black text-white">Need to send crypto payments or tips?</h3>
                <p className="text-xs text-slate-300">Accepting BTC, LTC, ETH, USDT, and SOL with direct address copy & QR codes.</p>
              </div>

              <button
                onClick={handleOpenCryptoPage}
                className="px-6 py-3 rounded-2xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs flex items-center gap-2 shrink-0 transition-all hover:scale-105 active:scale-95 shadow-xl"
              >
                <span>Open Crypto Payment Hub</span>
                <Icon name="external-link" className="w-4 h-4" />
              </button>
            </section>

            {/* Projects Showcase */}
            <section className="space-y-4">
              <h2 className="text-lg font-black text-white flex items-center gap-2">
                <span>Featured Engineering Projects</span>
              </h2>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                {profile.projects.map((proj) => (
                  <div key={proj.id} className="p-5 rounded-2xl bg-slate-900 border border-slate-800 space-y-3 hover:border-slate-700 transition-all shadow-lg">
                    <img src={proj.image} alt={proj.title} className="w-full h-36 object-cover rounded-xl border border-slate-800" />
                    <div className="space-y-1">
                      <div className="flex items-center justify-between">
                        <span className="text-[10px] font-mono font-bold text-amber-400 uppercase">{proj.category}</span>
                        <span className="text-xs text-amber-300 font-bold flex items-center gap-1"><Icon name="star" className="w-3.5 h-3.5 fill-amber-300" /> {proj.stars}</span>
                      </div>
                      <h3 className="text-sm font-bold text-white">{proj.title}</h3>
                      <p className="text-xs text-slate-400 leading-relaxed line-clamp-2">{proj.description}</p>
                    </div>
                  </div>
                ))}
              </div>
            </section>

            {/* Contact Form */}
            <section className="p-6 sm:p-8 rounded-3xl bg-slate-900 border border-slate-800 space-y-4 shadow-xl">
              <h2 className="text-lg font-black text-white flex items-center gap-2">
                <Icon name="mail" className="w-5 h-5 text-amber-400" />
                <span>Send Direct Message</span>
              </h2>

              {contactSent ? (
                <div className="p-4 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-bold text-center">
                  ✓ Your message has been sent directly to {profile.name}!
                </div>
              ) : (
                <form onSubmit={handleSendMessage} className="space-y-3">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <input 
                      type="text" 
                      placeholder="Your Full Name" 
                      required 
                      value={contactForm.name} 
                      onChange={e => setContactForm({...contactForm, name: e.target.value})} 
                      className="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white placeholder-slate-500 outline-none focus:border-amber-500"
                    />
                    <input 
                      type="email" 
                      placeholder="Your Email Address" 
                      required 
                      value={contactForm.email} 
                      onChange={e => setContactForm({...contactForm, email: e.target.value})} 
                      className="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white placeholder-slate-500 outline-none focus:border-amber-500"
                    />
                  </div>
                  <textarea 
                    placeholder="Write your message here..." 
                    rows="3" 
                    required 
                    value={contactForm.message} 
                    onChange={e => setContactForm({...contactForm, message: e.target.value})} 
                    className="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white placeholder-slate-500 outline-none focus:border-amber-500"
                  />
                  <button 
                    type="submit" 
                    className="w-full py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs flex items-center justify-center gap-2 transition-all active:scale-95 shadow-lg"
                  >
                    <Icon name="send" className="w-4 h-4" />
                    <span>Send Message</span>
                  </button>
                </form>
              )}
            </section>

          </main>

          {/* Footer */}
          <footer className="border-t border-slate-800 py-6 px-4 text-center text-xs text-slate-400 space-y-2 bg-slate-900">
            <p className="font-bold text-white">{profile.name} • Gravatar Identity & Crypto Hub</p>
            <p className="text-[11px] text-slate-500">Standalone Client Application • Fully Compatible with GitHub Pages</p>
          </footer>

        </div>
      );
    }

    // --- RENDER REACT APP ---
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
